name: Deploy
on:
  workflow_run:
    workflows: ["Docker"]
    types: [completed]
    branches: [main]
jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          IMAGE: ghcr.io/${{ github.event.workflow_run.head_repository.full_name }}:sha-${{ github.event.workflow_run.head_sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE
          script: |
            sudo podman pull "$IMAGE"
            sudo podman stop delivery-calculator || true
            sudo podman rm delivery-calculator || true
            sudo podman run -d --name delivery-calculator --restart=always -p 8080:8080 "$IMAGE"
